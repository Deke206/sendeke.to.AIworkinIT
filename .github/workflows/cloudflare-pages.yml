name: Deploy to Cloudflare Pages

# Pushes to main go live (production). Pushes to any other branch
# are deployed as a preview on Cloudflare Pages.
on:
  push:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME || 'sendeke-to' }} --branch=${{ github.ref_name }}
