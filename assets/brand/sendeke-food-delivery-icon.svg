<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="foodBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151C"/>
      <stop offset="100%" stop-color="#060709"/>
    </linearGradient>
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5E3A"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>
    <linearGradient id="electricCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#2E9EFF"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#foodBg)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="4"/>

  <!-- Hot Steam / Aroma Waves (Warm Fast Food Delivery) -->
  <path d="M220 102 C210 88 230 72 220 58" stroke="url(#neonOrange)" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M256 94 C246 80 266 64 256 50" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M292 102 C282 88 302 72 292 58" stroke="url(#neonOrange)" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Cloche Dome Top Handle Knob -->
  <ellipse cx="256" cy="122" rx="26" ry="14" fill="#FFFFFF"/>
  <rect x="250" y="128" width="12" height="12" fill="#FFFFFF"/>

  <!-- Restaurant Cloche Food Dome (Crisp White Silhouette) -->
  <path d="M116 294 C116 176 396 176 396 294 Z" fill="#FFFFFF"/>
  
  <!-- Sleek Cutout Inner Arc for Dimension -->
  <path d="M152 284 C152 206 360 206 360 284 Z" fill="#0A0B0E"/>

  <!-- Fork & Knife Emblem Cut into Center of Dome -->
  <g transform="translate(256, 245) scale(0.85)">
    <!-- Fork (Left) -->
    <path d="M-22 -32 V-16 C-22 -8 -16 -4 -16 2 V28 H-20 V2 H-16" stroke="url(#neonOrange)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <line x1="-26" y1="-32" x2="-26" y2="-20" stroke="url(#neonOrange)" stroke-width="4" stroke-linecap="round"/>
    <line x1="-18" y1="-32" x2="-18" y2="-20" stroke="url(#neonOrange)" stroke-width="4" stroke-linecap="round"/>
    <!-- Knife (Right) -->
    <path d="M20 -32 C12 -28 12 -12 12 2 V28 H16 V-32 Z" fill="url(#neonOrange)"/>
  </g>

  <!-- Serving Tray Base / Speed Beam (Electric Cyan LED) -->
  <rect x="88" y="306" width="336" height="24" rx="12" fill="#FFFFFF"/>
  <path d="M72 318 H440" stroke="url(#electricCyan)" stroke-width="14" stroke-linecap="round" filter="url(#cyanGlow)"/>

  <!-- Front & Rear High-Speed Wheels (SenDeke Courier Signature) -->
  <!-- Left Wheel -->
  <circle cx="168" cy="396" r="46" fill="#FFFFFF"/>
  <circle cx="168" cy="396" r="26" fill="#0A0B0E"/>
  <circle cx="168" cy="396" r="11" fill="#00F0FF"/>

  <!-- Right Wheel -->
  <circle cx="344" cy="396" r="46" fill="#FFFFFF"/>
  <circle cx="344" cy="396" r="26" fill="#0A0B0E"/>
  <circle cx="344" cy="396" r="11" fill="#00F0FF"/>
</svg>
