<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121318"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0C79D8"/>
    </linearGradient>
  </defs>
  
  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="4"/>

  <!-- Forward Motion Aerodynamic Courier Pod / Vehicle Body -->
  <!-- Main Cab & Cargo Shell -->
  <path d="M120 148 H276 C354 148 408 196 408 260 C408 324 354 352 276 352 H120 V148 Z" fill="#FFFFFF"/>
  
  <!-- Aerodynamic Window / Cockpit Cutout -->
  <path d="M172 196 H266 C308 196 342 222 342 258 C342 292 308 308 266 308 H172 V196 Z" fill="#0A0B0E"/>

  <!-- Electric LED Speed Streak (Honoring the LED Courier Bike) -->
  <path d="M96 254 H350" stroke="url(#cyanGlow)" stroke-width="14" stroke-linecap="round"/>

  <!-- Front & Rear High-Impact Wheels with Rim Detail -->
  <!-- Rear Wheel (Left) -->
  <circle cx="168" cy="386" r="44" fill="#FFFFFF"/>
  <circle cx="168" cy="386" r="24" fill="#0A0B0E"/>
  <circle cx="168" cy="386" r="10" fill="#00F0FF"/>

  <!-- Front Wheel (Right) -->
  <circle cx="344" cy="386" r="44" fill="#FFFFFF"/>
  <circle cx="344" cy="386" r="24" fill="#0A0B0E"/>
  <circle cx="344" cy="386" r="10" fill="#00F0FF"/>
</svg>
